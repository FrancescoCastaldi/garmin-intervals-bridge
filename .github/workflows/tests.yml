name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e '.[dev]'
      - run: ruff check src tests
      - run: pytest -q
      - run: pip-audit --progress-spinner off
  # The guides promise Windows and the Mac: install the package there and run what a first
  # command does (settings, time zone, data folder, locks), without network or a key.
  smoke:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install .
      - run: garmin-intervals-bridge --version
      - run: garmin-intervals-bridge status
        env:
          INTERVALS_API_KEY: not-a-real-key
          BRIDGE_DATA_DIR: ${{ runner.temp }}/bridge-data
