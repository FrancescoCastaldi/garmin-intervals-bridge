services:
  bridge:
    # the published image (amd64 + arm64); `docker compose build` still works from the source
    image: ghcr.io/futureweb/garmin-intervals-bridge:latest
    build: .
    init: true
    env_file: .env
    environment:
      BRIDGE_DATA_DIR: /data
      GARMIN_TOKEN_DIR: /data/tokens
    volumes:
      - ./data:/data
    # Runs as UID 10001 (see Dockerfile); the data directory must be writable by it.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # `docker compose up -d` keeps the bridge running (polls Intervals every minute, a full run
    # every 30 minutes) and restarts it after a reboot. It starts as a dry run: read what it would
    # do with `docker compose logs -f`, then change the command to ["run", "--apply"] and `up -d`
    # again. Set BRIDGE_TIMEZONE in .env: a container has no time zone of its own.
    # (Cron instead: `docker compose run --rm -T bridge watch --apply` every minute and
    # `... sync --apply` every 30 minutes; leave the service itself stopped then.)
    restart: unless-stopped
    command: ["run"]
