services:
  bridge:
    # the published image (amd64 + arm64); `docker compose build` still works from the source
    image: ghcr.io/futureweb/garmin-intervals-bridge:latest
    build: .
    init: true
    env_file: .env
    environment:
      BRIDGE_DATA_DIR: /data
      GARMIN_TOKEN_DIR: /data/tokens
      # The web page (status, Garmin sign-in with MFA, settings, actions) on port 8765:
      # BRIDGE_UI_PORT: "8765"
      # BRIDGE_UI_PASSWORD: "change-me-please"     # your own, 8+ characters
    # ports:
    #   - "127.0.0.1:8765:8765"                    # or "8765:8765" for the whole network
    volumes:
      - ./data:/data
    # Runs as UID 10001 (see Dockerfile); the data directory must be writable by it.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "garmin-intervals-bridge", "status"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 20s
    # `docker compose up -d` keeps the bridge running (polls Intervals every 5 minutes, a full run
    # every 30 minutes) and restarts it after a reboot. It starts as a dry run: read what it would
    # do with `docker compose logs -f`, then change the command to ["run", "--apply"] and `up -d`
    # again. Set BRIDGE_TIMEZONE in .env: a container has no time zone of its own.
    # (Cron instead: `docker compose run --rm -T bridge watch --apply` every 5 minutes and
    # `... sync --apply` every 30 minutes; leave the service itself stopped then.)
    restart: unless-stopped
    command: ["run"]
